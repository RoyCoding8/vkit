name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: tools/history/go.sum
      - name: Build pinned history helper
        shell: python
        run: |
          import hashlib
          import os
          import pathlib
          import subprocess
          directory = pathlib.Path("tools/history")
          binary = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("vkit-history.exe" if os.name == "nt" else "vkit-history")
          environment = dict(os.environ, GOTOOLCHAIN="local")
          subprocess.run(["go", "test", "-mod=readonly", "./..."], cwd=directory, env=environment, check=True)
          subprocess.run(["go", "build", "-mod=readonly", "-trimpath", "-buildvcs=false", "-o", str(binary), "."],
                         cwd=directory, env=environment, check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VKIT_HISTORY_BIN={binary}\n")
              output.write(f"VKIT_HISTORY_SHA256={hashlib.sha256(binary.read_bytes()).hexdigest()}\n")
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Perses
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/uw-pluverse/perses/releases/download/v2.7/perses_deploy.jar -o "$RUNNER_TEMP/perses.jar"
          echo "1102ec7e3e601792a3c271c41ac7df52b03fca635df552500c241933c2c1e427  $RUNNER_TEMP/perses.jar" | sha256sum --check
          echo "VKIT_PERSES_JAR=$RUNNER_TEMP/perses.jar" >> "$GITHUB_ENV"
          echo "VKIT_PERSES_SHA256=1102ec7e3e601792a3c271c41ac7df52b03fca635df552500c241933c2c1e427" >> "$GITHUB_ENV"
      - run: uv sync --python 3.11 --extra test --extra engines
      - run: uv run pytest -ra
      - run: uv run python scripts/e2e.py
