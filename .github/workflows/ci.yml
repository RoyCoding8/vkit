name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.11 --extra test
      - run: uv run pytest -ra
      - run: uvx ruff@0.14.0 check --isolated --select E4,E7,E9,F src tests scripts
      - run: uv build
      - name: Run the installed wheel CLI
        run: uv run python -c "from pathlib import Path; import subprocess; wheel = next(Path('dist').glob('*.whl')); subprocess.run(['uv', 'run', '--isolated', '--no-project', '--with', str(wheel.resolve()), 'vkit', '--help'], check=True)"

  formal:
    name: Lean and TLC evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/lean-proof
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Use the pinned Lean binary in disposable projects
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          binary = subprocess.run(["elan", "which", "lean"], cwd="examples/lean-proof",
                                  check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(pathlib.Path(binary).parent) + "\n")
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned TLC checker
        shell: python
        run: |
          import hashlib
          import os
          import pathlib
          import urllib.request

          digest = pathlib.Path("examples/formal-ci/tla2tools.sha256").read_text().strip()
          url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          with urllib.request.urlopen(url, timeout=60) as response:
              content = response.read(10_000_001)
          if len(content) > 10_000_000 or hashlib.sha256(content).hexdigest() != digest:
              raise RuntimeError("TLC release digest mismatch")
          jar = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tla2tools.jar"
          jar.write_bytes(content)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VKIT_TLA2TOOLS_JAR={jar}\n")
      - run: uv sync --python 3.11 --extra test
      - run: uv run python scripts/verify_formal.py --backend all
