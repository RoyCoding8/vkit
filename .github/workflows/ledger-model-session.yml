name: Ledger model iteration session

on:
  workflow_call:
    inputs:
      minutes:
        type: string
        required: true

permissions:
  contents: read
  checks: write

concurrency:
  group: ledger-model-session-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.3/install
          enable_kvm: false
      - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: rr-${{ runner.os }}-${{ hashFiles('examples/refinedrust-qualification/upstream.json') }}-${{ github.run_id }}
          restore-prefixes-first-match: rr-${{ runner.os }}-${{ hashFiles('examples/refinedrust-qualification/upstream.json') }}-
      - name: Capture the pinned upstream checkout
        shell: python
        run: |
          import json, os, pathlib, subprocess
          pin = json.loads(pathlib.Path("examples/refinedrust-qualification/upstream.json").read_text())
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "refinedrust"
          subprocess.run(["git", "init", str(root)], check=True)
          subprocess.run(["git", "-C", str(root), "remote", "add", "origin", pin["repository"]], check=True)
          subprocess.run(["git", "-C", str(root), "fetch", "--depth", "1", "origin", pin["revision"]], check=True)
          subprocess.run(["git", "-C", str(root), "checkout", "--detach", "FETCH_HEAD"], check=True)
      - name: Check observed branch tips
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SESSION_MINUTES: ${{ inputs.minutes }}
        run: python3 scripts/check_ledger_session.py --minutes "$SESSION_MINUTES" --upstream "$RUNNER_TEMP/refinedrust" --output "$RUNNER_TEMP/ledger-model-session"
      - name: Retain every revision's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledger-model-session-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger-model-session
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
