name: Ledger qualification

on:
  push:
    branches: [main, codex/formal-qualification]
    paths:
      - .github/workflows/ledger-qualification.yml
      - examples/verus-qualification/**
      - scripts/check_ledger_container.py
      - src/vkit/formal/**
      - src/vkit/container.py
      - scripts/check_verus_ledger.py
  pull_request:
    paths:
      - .github/workflows/ledger-qualification.yml
      - examples/verus-qualification/**
      - scripts/check_ledger_container.py
      - src/vkit/formal/**
      - src/vkit/container.py
      - scripts/check_verus_ledger.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verus-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the Docker runtime
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "BLOCKED: Docker daemon is unavailable; the qualification cannot run without isolation." >&2
            exit 1
          fi
      - name: Build the qualification image before sealed execution
        env:
          IMAGE_TAG: vkit-ledger-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker build --file examples/verus-qualification/container/Dockerfile --tag "$IMAGE_TAG" examples/verus-qualification/container
      - name: Install the official pinned Verus release
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import urllib.request
          import zipfile

          pin = json.loads(pathlib.Path("src/vkit/formal/packages/resource_ledger/upstream.json").read_text())
          name = f"verus-{pin['version']}-x86-linux.zip"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
          urllib.request.urlretrieve(f"{pin['repository']}/releases/download/{pin['release']}/{name}", archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin["archives"][name]:
              raise SystemExit("official archive hash mismatch")
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus")
          tool = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus/verus-x86-linux"
          for entry in tool.iterdir():
              if entry.is_file() and entry.suffix == "":
                  entry.chmod(entry.stat().st_mode | 0o111)
          rustup_home = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vkit-rustup"
          cargo_home = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vkit-cargo"
          rustup_binary = cargo_home / "bin/rustup"
          rustup_binary.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(shutil.which("rustup"), rustup_binary)
          rustup_binary.chmod(0o755)
          env = os.environ.copy()
          env["RUSTUP_HOME"] = str(rustup_home)
          env["CARGO_HOME"] = str(cargo_home)
          subprocess.run([str(rustup_binary), "toolchain", "install", pin["rust"], "--profile", "minimal"], check=True, env=env)
      - name: Install the VKit runtime for product execution
        run: |
          python3 -m venv "$RUNNER_TEMP/vkit-venv"
          "$RUNNER_TEMP/vkit-venv/bin/python" -m pip install --disable-pip-version-check --editable .
      - name: Verify and challenge the ledger
        env:
          IMAGE_TAG: vkit-ledger-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "$RUNNER_TEMP/vkit-venv/bin/python" scripts/check_ledger_container.py \
            --image "$IMAGE_TAG" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --verus-root "$RUNNER_TEMP/verus/verus-x86-linux" \
            --archive "$RUNNER_TEMP/verus-0.2026.10.18.7d82994-x86-linux.zip" \
            --rustup-home "$RUNNER_TEMP/vkit-rustup" \
            --cargo-home "$RUNNER_TEMP/vkit-cargo" \
            --output "$RUNNER_TEMP/verus-ledger-evidence"
      - name: Remove only this run's containers
        if: always()
        env:
          IMAGE_TAG: vkit-ledger-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          PYTHON=python3
          if [ -x "$RUNNER_TEMP/vkit-venv/bin/python" ]; then PYTHON="$RUNNER_TEMP/vkit-venv/bin/python"; fi
          "$PYTHON" scripts/check_ledger_container.py \
            --image "$IMAGE_TAG" \
            --cleanup-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/verus-ledger-evidence"
      - name: Retain the comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verus-ledger-${{ github.sha }}
          path: ${{ runner.temp }}/verus-ledger-evidence
          if-no-files-found: error
          retention-days: 14
