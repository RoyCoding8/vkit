name: Ledger qualification

on:
  push:
    branches: [main, codex/formal-qualification]
    paths:
      - .github/workflows/ledger-qualification.yml
      - examples/verus-qualification/**
      - formal/packages/resource_ledger/ledger.rs
      - scripts/check_verus_ledger.py
  pull_request:
    paths:
      - .github/workflows/ledger-qualification.yml
      - examples/verus-qualification/**
      - formal/packages/resource_ledger/ledger.rs
      - scripts/check_verus_ledger.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verus-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the official pinned Verus release
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request
          import zipfile

          pin = json.loads(pathlib.Path("examples/verus-qualification/upstream.json").read_text())
          name = f"verus-{pin['version']}-x86-linux.zip"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
          urllib.request.urlretrieve(f"{pin['repository']}/releases/download/{pin['release']}/{name}", archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin["archives"][name]:
              raise SystemExit("official archive hash mismatch")
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus")
          tool = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus/verus-x86-linux"
          for entry in tool.iterdir():
              if entry.is_file() and entry.suffix == "":
                  entry.chmod(entry.stat().st_mode | 0o111)
          subprocess.run(["rustup", "toolchain", "install", pin["rust"], "--profile", "minimal"], check=True)
      - name: Verify and challenge the ledger
        run: |
          python3 scripts/check_verus_ledger.py \
            --verus-root "$RUNNER_TEMP/verus/verus-x86-linux" \
            --archive "$RUNNER_TEMP/verus-0.2026.10.18.7d82994-x86-linux.zip" \
            --output "$RUNNER_TEMP/verus-ledger-evidence"
      - name: Retain the comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verus-ledger-${{ github.sha }}
          path: ${{ runner.temp }}/verus-ledger-evidence
          if-no-files-found: error
          retention-days: 14
