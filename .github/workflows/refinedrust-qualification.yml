name: RefinedRust qualification

on:
  push:
    branches: [codex/formal-qualification]
    paths:
      - .github/workflows/refinedrust-qualification.yml
      - examples/refinedrust-qualification/**
      - formal/packages/resource_ledger/**
      - scripts/qualify_refinedrust.py
  workflow_dispatch:
    inputs:
      probe:
        description: Run the full regression or one existing probe
        type: choice
        options: [full, model, collection, unsafe_body, verus]
        default: full
      session_minutes:
        description: Keep one model environment alive; 0 runs the one-shot probe
        type: choice
        options: ["0", "10", "20", "30"]
        default: "0"

permissions:
  contents: read

concurrency:
  group: refinedrust-qualification-${{ github.ref }}-${{ inputs.session_minutes && inputs.session_minutes != '0' && 'session' || inputs.probe || 'full' }}
  cancel-in-progress: ${{ !inputs.session_minutes || inputs.session_minutes == '0' }}

jobs:
  qualification:
    if: github.event_name != 'workflow_dispatch' || (inputs.session_minutes == '0' && inputs.probe != 'verus')
    name: Q0 source and body proof probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.3/install
          enable_kvm: false
      - name: Restore the pinned build dependencies
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: rr-${{ runner.os }}-${{ hashFiles('examples/refinedrust-qualification/upstream.json') }}-${{ github.run_id }}
          restore-prefixes-first-match: rr-${{ runner.os }}-${{ hashFiles('examples/refinedrust-qualification/upstream.json') }}-
      - name: Capture the pinned upstream checkout
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess

          pin = json.loads(pathlib.Path("examples/refinedrust-qualification/upstream.json").read_text())
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "refinedrust"
          subprocess.run(["git", "init", str(root)], check=True)
          subprocess.run(["git", "-C", str(root), "remote", "add", "origin", pin["repository"]], check=True)
          subprocess.run(["git", "-C", str(root), "fetch", "--depth", "1", "origin", pin["revision"]], check=True)
          subprocess.run(["git", "-C", str(root), "checkout", "--detach", "FETCH_HEAD"], check=True)
      - name: Run the selected qualification probe
        shell: bash
        env:
          PROBE: ${{ inputs.probe || 'full' }}
        run: |
          if [ "$PROBE" = full ]; then set --; else set -- --only "$PROBE"; fi
          python3 scripts/qualify_refinedrust.py \
            --upstream "$RUNNER_TEMP/refinedrust" \
            --output "$RUNNER_TEMP/refinedrust-qualification" "$@"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refinedrust-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/refinedrust-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Make Nix build locks readable for cache archiving
        if: always() && steps.nix-cache.outcome == 'success'
        run: sudo find /nix/store -maxdepth 1 -type f -name '*.lock' -exec chmod a+r {} +
      - name: Save the build dependencies after the probe
        if: always() && steps.nix-cache.outcome == 'success'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
  model-session:
    if: github.event_name == 'workflow_dispatch' && inputs.session_minutes != '0' && inputs.probe != 'verus'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ledger-model-session.yml
    with:
      minutes: ${{ inputs.session_minutes }}
  verus-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.probe == 'verus'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the official pinned Verus release
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request
          import zipfile

          pin = json.loads(pathlib.Path("examples/verus-qualification/upstream.json").read_text())
          name = f"verus-{pin['version']}-x86-linux.zip"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
          urllib.request.urlretrieve(f"{pin['repository']}/releases/download/{pin['release']}/{name}", archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin["archives"][name]:
              raise SystemExit("official archive hash mismatch")
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus")
          tool = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verus/verus-x86-linux"
          for entry in tool.iterdir():
              if entry.is_file() and entry.suffix == "":
                  entry.chmod(entry.stat().st_mode | 0o111)
          subprocess.run(["rustup", "toolchain", "install", pin["rust"], "--profile", "minimal"], check=True)
      - name: Verify and challenge the ledger
        run: |
          python3 scripts/check_verus_ledger.py \
            --verus-root "$RUNNER_TEMP/verus/verus-x86-linux" \
            --archive "$RUNNER_TEMP/verus-0.2026.10.18.7d82994-x86-linux.zip" \
            --output "$RUNNER_TEMP/verus-ledger-evidence"
      - name: Retain the comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verus-ledger-${{ github.sha }}
          path: ${{ runner.temp }}/verus-ledger-evidence
          if-no-files-found: error
          retention-days: 14
