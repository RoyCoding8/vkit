[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vkit"
version = "0.3.0"
description = "Machine-checked evidence about a repository, for agents and the people who review them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "rich>=13,<16",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
test = ["pytest>=8.0", "mcp>=2.2,<3", "anyio>=4.5", "hypothesis>=6.100"]

[project.scripts]
vkit = "vkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vkit"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vkit/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
