[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vkit"
version = "0.2.0"
description = "Machine-checked evidence about a repository, for agents and the people who review them."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
test = ["pytest>=8.0", "mcp>=2.2,<3", "anyio>=4.5", "hypothesis>=6.100"]

[project.scripts]
vkit = "vkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vkit"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vkit/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
