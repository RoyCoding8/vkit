[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vkit"
version = "0.2.0"
description = "Machine-checked evidence about a repository, for agents and the people who review them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "rich>=13,<16",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
engines = [
    "PyYAML==6.0.3",
    "cvc5==1.4.2",
    "egglog==13.2.0",
    "greenery==4.2.2",
    "jsonsubschema==0.0.8",
    "portion==2.6.3",
    "jsonref==1.1.0",
    "jsonschema==4.26.0",
    "resolvelib==1.2.1",
    "packaging==26.3",
    "lark==1.3.1",
    "ortools==9.15.6755",
    "pycparser==3.0",
    "sympy==1.14.0",
    "crosshair-tool==0.0.111",
    "sqlglot==30.22.0",
    "perfetto==0.58.2",
    "pybatfish==2026.9.17.3748",
    "schemathesis==4.30.0",
    "hypothesis==6.169.0",
    "tree-sitter==0.25.2",
    "tree-sitter-rust==0.24.2",
    "islpy==2026.2.2; sys_platform != 'win32'",
]
test = ["pytest>=8.0", "mcp>=2.2,<3", "anyio>=4.5", "hypothesis>=6.100"]

[project.scripts]
vkit = "vkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vkit"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vkit/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
